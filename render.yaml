services:
  - type: web
    name: neiron-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Almaty
      - key: NOTIFICATIONS_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BRANCH_ID
        sync: false
      - key: APP_URL
        sync: false
      - key: GREEN_API_ID
        sync: false
      - key: GREEN_API_TOKEN
        sync: false
      - key: ADMIN_NOTIFY_PHONE
        sync: false
